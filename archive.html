true,"showInProposals":false,"seo":{"title":"Understanding the 2024 Korea National Health and Nutrition Examination Survey","description":"A preparatory introduction to KNHANES for a planned diet and anxiety study, before access to the 2024 participant-level microdata.","ogImageUrl":"/images/archive/post-031/cover.webp"}},{"status":"Published","researchThread":"Diet and Anxiety","no":32,"title":"Turning Dietary Habits into Measurable Variables","slug":"turning-dietary-habits-into-measurable-variables","url":"/archive/turning-dietary-habits-into-measurable-variables","contentType":"Learning Note","inquiryStage":"","activityDate":"2025-12-27","activityYear":2025,"publishDate":"2025-12-27","cmsPublishedAt":"2025-12-27T09:00:00+09:00","researchTheme":"Biomedical Science","authorNickname":"YOUNG BIO-SCHOLAR","authorLogoUrl":"/images/shared/author-logo.webp","featuredImageUrl":"/images/archive/post-032/cover.webp","featuredImageAlt":"A student eating a meal at a table with food containers, fruit, and water","researchQuestion":"","showOnHome":true,"showInProposals":false,"seo":{"title":"Turning Dietary Habits into Measurable Variables","description":"A preparatory learning note on dietary amount, frequency, regularity, variable definitions, and missing data before access to KNHANES 2024 microdata.","ogImageUrl":"/images/archive/post-032/cover.webp"}}]};window.BIO_ARCHIVE_DETAILS={"turning-dietary-habits-into-measurable-variables":{"ok":true,"generatedAt":"2026-11-02T01:40:03+09:00","settings":{"siteTitle":"Young Bio-Scholar's Research Archive","authorNickname":"YOUNG BIO-SCHOLAR","authorLogoPath":"shared/author-logo.webp","imageBaseUrl":"/images/","archiveBasePath":"/archive/","postsPerListPage":5,"timezone":"Asia/Seoul"},"post":{"no":1,"title":"Turning Dietary Habits into Measurable Variables","slug":"turning-dietary-habits-into-measurable-variables","url":"/archive/turning-dietary-habits-into-measurable-variables","contentType":"Learning Note","inquiryStage":"","activityDate":"2025-12-27","activityYear":2025,"publishDate":"2025-12-27","cmsPublishedAt":"2025-12-27T09:00:00+09:00","researchTheme":"Biomedical Science","authorNickname":"YOUNG BIO-SCHOLAR","authorLogoUrl":"/images/shared/author-logo.webp","featuredImageUrl":"/images/archive/post-032/cover.webp","featuredImageAlt":"A student eating a meal at a table with food containers, fruit, and water","researchQuestion":"","showOnHome":true,"showInProposals":false,"seo":{"title":"Turning Dietary Habits into Measurable Variables","description":"A preparatory learning note on dietary amount, frequency, regularity, variable definitions, and missing data before access to KNHANES 2024 microdata.","ogImageUrl":"/images/archive/post-032/cover.webp"},"reflection":"I initially thought of variable selection as finding a column related to diet. I now understand that it also involves deciding what that column can represent.\n\nA precise definition will not remove every limitation, but it will make the analysis easier to interpret. Before asking whether diet is associated with anxiety symptoms, I need to be clear about what I mean by diet.","notes":"","revisionNote":"","blocks":[{"order":1,"type":"Paragraph","headingLevel":"","heading":"","content":"After learning about the structure of KNHANES, I began thinking about a more specific problem: what would “diet” mean in my study?","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":2,"type":"Paragraph","headingLevel":"","heading":"","content":"People often describe their eating habits as healthy, balanced, or irregular. These descriptions are understandable in everyday conversation, but a statistical analysis needs clearer definitions. Before examining a relationship between diet and anxiety symptoms, I need to decide what aspect of eating a variable is intended to measure.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":3,"type":"Paragraph","headingLevel":"","heading":"","content":"This note explores those measurement decisions before access to the 2024 KNHANES microdata. The examples below are possible approaches, not confirmed variables or completed analyses.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":4,"type":"Heading","headingLevel":"H2","heading":"Starting with a Clear Definition","content":"","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":5,"type":"Paragraph","headingLevel":"","heading":"","content":"“Dietary habits” can refer to several different things: the amount someone eats, how often they consume particular foods, or how regularly they eat meals.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":6,"type":"Paragraph","headingLevel":"","heading":"","content":"These measures answer different questions. The amount of a food consumed does not tell me how frequently it is eaten. Similarly, eating breakfast regularly does not describe the nutritional composition of that breakfast.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":7,"type":"Paragraph","headingLevel":"","heading":"","content":"I therefore need to move from a broad concept to a specific question. Instead of asking only whether someone has a healthy diet, I might ask what dietary component was measured, over what period, and in what unit.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":8,"type":"Heading","headingLevel":"H2","heading":"Amount, Frequency, and Regularity","content":"","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":9,"type":"Paragraph","headingLevel":"","heading":"","content":"Diet can be described in different ways. I found it helpful to distinguish between how much someone eats, how often they eat a particular food, and how regularly they eat meals.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":10,"type":"Paragraph","headingLevel":"","heading":"","content":"Amount describes how much was consumed—for example, the grams of a food eaten during one recorded day. To interpret this measure, I need to know which food is included, how portions were estimated, and what period the record covers.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":11,"type":"Paragraph","headingLevel":"","heading":"","content":"Frequency describes how often a food was eaten—for example, the number of days someone ate fruit during a week. This tells me about repeated consumption, but it does not necessarily tell me how much was eaten each time.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":12,"type":"Paragraph","headingLevel":"","heading":"","content":"Regularity concerns the consistency of an eating routine. The number of days someone ate breakfast during a week could provide one indication of meal regularity. However, it would not tell me whether breakfast was eaten at a similar time each day or what the meal contained.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":13,"type":"Paragraph","headingLevel":"","heading":"","content":"These examples helped me see that different measures capture different parts of diet. They are possibilities for planning; I will need to check the released 2024 data and documentation before deciding which measures my study can use.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":14,"type":"Image","headingLevel":"","heading":"","content":"","quoteSource":"","imageUrl":"/images/archive/post-032/figure-01.webp","imageAlt":"Overhead view of bibimbap with vegetables and an egg, accompanied by Korean side dishes","caption":""},{"order":15,"type":"Heading","headingLevel":"H2","heading":"One Day Is Not the Same as a Habit","content":"","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":16,"type":"Paragraph","headingLevel":"","heading":"","content":"A dietary record can be detailed without describing someone’s usual diet.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":17,"type":"Paragraph","headingLevel":"","heading":"","content":"For example, a 24-hour recall captures intake during a particular day. That day might include an unusual meal, a missed breakfast, or foods the person rarely eats. A single day therefore should not automatically be treated as an individual’s long-term eating pattern.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":18,"type":"Paragraph","headingLevel":"","heading":"","content":"This does not make the information useless. It means that the interpretation must match the measurement. I need to distinguish between recorded intake and habitual intake when describing the study.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":19,"type":"Paragraph","headingLevel":"","heading":"","content":"The National Cancer Institute’s dietary assessment guidance emphasizes this distinction between short-term observations and usual intake. [1]","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":20,"type":"Heading","headingLevel":"H2","heading":"Choosing How to Represent a Variable","content":"","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":21,"type":"Paragraph","headingLevel":"","heading":"","content":"A measured amount can sometimes be kept as a numerical variable or grouped into categories.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":22,"type":"Paragraph","headingLevel":"","heading":"","content":"Keeping the original numerical values preserves differences between participants. Grouping values can make comparisons easier to explain, but it also removes detail. Two people with different values may be placed in the same category, while people close to a cutoff may be placed in different groups.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":23,"type":"Paragraph","headingLevel":"","heading":"","content":"Categories also need a reason. A group labeled “high intake” is meaningful only if the reader knows how “high” was defined.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":24,"type":"Paragraph","headingLevel":"","heading":"","content":"For my study, I will need to choose a representation that fits the research question and the available measurement. I should establish and document those choices before examining which version produces a stronger association with anxiety symptoms.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":25,"type":"Heading","headingLevel":"H2","heading":"Missing Information Is Not Zero","content":"","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":26,"type":"Paragraph","headingLevel":"","heading":"","content":"Another important distinction is between a recorded zero and missing information.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":27,"type":"Paragraph","headingLevel":"","heading":"","content":"If a participant reports consuming none of a particular food during the recorded period, that may be a valid observation. If the participant did not answer the question, the intake is unknown.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":28,"type":"Paragraph","headingLevel":"","heading":"","content":"Treating both situations as zero would change the meaning of the data. Likewise, a code for “not applicable” should not automatically be interpreted as a dietary behavior.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":29,"type":"Paragraph","headingLevel":"","heading":"","content":"Once the microdata are available, I will need to check the coding instructions before calculating or comparing values.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":30,"type":"Heading","headingLevel":"H2","heading":"A Dietary Component Is Not an Entire Pattern","content":"","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":31,"type":"Paragraph","headingLevel":"","heading":"","content":"The working title of my research refers to dietary patterns, but a single nutrient or food measure describes only part of a diet.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":32,"type":"Paragraph","headingLevel":"","heading":"","content":"A broader pattern may involve several foods or behaviors considered together. Constructing such a measure requires a clear method and suitable data. I should not label an individual nutrient measure as an overall dietary pattern simply because it concerns nutrition.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":33,"type":"Paragraph","headingLevel":"","heading":"","content":"This helped me recognize that the wording of the research question may need refinement after the available measures are confirmed.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":34,"type":"Heading","headingLevel":"H2","heading":"Preparing for the Data Release","content":"","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":35,"type":"Paragraph","headingLevel":"","heading":"","content":"Before accessing the microdata, I can prepare a checklist for each candidate dietary variable:","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":36,"type":"List","headingLevel":"","heading":"","content":"What concept does it measure?\nWhat period does it describe?\nWhat unit or response scale does it use?\nWho was eligible to answer?\nHow are missing or inapplicable responses recorded?\nWhat conclusions would the measure reasonably support?","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":37,"type":"Paragraph","headingLevel":"","heading":"","content":"After the 2024 microdata and documentation are released, I will use these questions to assess the available variables. The final definitions will then provide a foundation for the later analysis.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""}],"references":[{"order":1,"authors":"National Cancer Institute","title":"Dietary Assessment Primer","journalOrPublisher":"National Cancer Institute","year":null,"doi":"","url":"https://dietassessmentprimer.cancer.gov/","accessedDate":""},{"order":2,"authors":"Korea Disease Control and Prevention Agency","title":"Korea National Health and Nutrition Examination Survey (KNHANES)","journalOrPublisher":"Korea Disease Control and Prevention Agency","year":null,"doi":"","url":"https://knhanes.kdca.go.kr/knhanes/main.do","accessedDate":""}]}},"why-sleep-matters-for-the-adolescent-brain":{"ok":true,"generatedAt":"2026-11-02T01:40:03+09:00","settings":{"siteTitle":"Young Bio-Scholar's Research Archive","authorNickname":"YOUNG BIO-SCHOLAR","authorLogoPath":"shared/author-logo.webp","imageBaseUrl":"/images/","archiveBasePath":"/archive/","postsPerListPage":5,"timezone":"Asia/Seoul"},"post":{"no":17,"title":"Why Does Sleep Matter for the Adolescent Brain?","slug":"why-sleep-matters-for-the-adolescent-brain","url":"/archive/why-sleep-matters-for-the-adolescent-brain","contentType":"Learning Note","inquiryStage":"","activityDate":"2024-01-13","activityYear":2024,"publishDate":"2024-01-13","cmsPublishedAt":"2026-10-07T23:10:10+09:00","researchTheme":"Biomedical Science","authorNickname":"YOUNG BIO-SCHOLAR","authorLogoUrl":"/images/shared/author-logo.webp","featuredImageUrl":"/images/archive/post-016/cover.webp","featuredImageAlt":"A clinician points to a sagittal brain scan displayed on a medical monitor","researchQuestion":"If sleep supports attention, learning, and emotional regulation, could depression be related to how long adolescents sleep?","showOnHome":true,"showInProposals":false,"seo":{"title":"Why Does Sleep Matter for the Adolescent Brain? | Young Bio-Scholar’s Research Archive","description":"A Grade 10 learning note exploring why sleep matters for the developing adolescent brain, learning, memory, and emotional regulation.","ogImageUrl":"/images/archive/post-016/cover.webp"},"reflection":"I first viewed sleep as time when the brain stopped working. I now understand it as an active biological process connected to both learning and emotional health. This change in my understanding led me to look more closely at the relationship between depression and sleeping time among adolescents.","notes":"","revisionNote":"","blocks":[{"order":1,"type":"Paragraph","headingLevel":"","heading":"","content":"I used to think of sleep mainly as a period of rest after a busy day. However, as I began learning about the adolescent brain, I realized that sleep is also connected to how the brain learns, manages emotions, and prepares for the next day.  This made sleep seem less like an inactive state and more like an important biological process.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":2,"type":"Heading","headingLevel":"H2","heading":"THE ADOLESCENT BRAIN IS STILL DEVELOPING","content":"","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":3,"type":"Paragraph","headingLevel":"","heading":"","content":"Adolescence is a period of continuing brain development. Brain systems involved in planning, attention, decision-making, and emotional control are still changing during these years.  Because these systems are developing, everyday conditions such as sleep may be especially important. A lack of sleep does not simply make a student feel tired. It may also affect concentration, memory, mood, and the ability to respond to stress.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":4,"type":"Heading","headingLevel":"H2","heading":"SLEEP SUPPORTS LEARNING AND MEMORY","content":"","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":5,"type":"Paragraph","headingLevel":"","heading":"","content":"During the day, the brain receives a large amount of new information. Sleep helps the brain organize and strengthen some of what has been learned.  This does not mean that sleep can replace studying. Instead, studying and sleeping work together. Learning introduces new information, while sleep supports the processes that help the brain retain and use it.  This helped me understand why reduced sleep could influence school performance even when a student spends more time studying.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":6,"type":"Heading","headingLevel":"H2","heading":"SLEEP AND EMOTIONAL REGULATION","content":"","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":7,"type":"Paragraph","headingLevel":"","heading":"","content":"Sleep is also connected to emotion. After insufficient sleep, it may become more difficult to manage negative feelings or respond calmly to stressful situations.  This relationship is especially interesting during adolescence because changes in sleep patterns and emotional health can occur during the same period. However, a connection does not automatically show which factor comes first.  Poor sleep may affect mood, but emotional difficulties may also change sleep. Other biological, behavioral, and environmental factors may influence both.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":8,"type":"Heading","headingLevel":"H2","heading":"MORE THAN THE NUMBER OF HOURS","content":"","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":9,"type":"Paragraph","headingLevel":"","heading":"","content":"Sleep duration is important, but it is not the only part of healthy sleep. Sleep quality, timing, regularity, and biological rhythms can also affect how rested a person feels.  For this first note, I focused on why sleep matters. My next step is to understand more clearly what happens in the brain during sleep and how different parts of sleep can be measured.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""}],"references":[{"order":1,"authors":"Tarokh L, Saletin JM, Carskadon MA","title":"Sleep in adolescence: Physiology, cognition and mental health","journalOrPublisher":"Neuroscience & Biobehavioral Reviews","year":2016,"doi":"10.1016/j.neubiorev.2016.08.008","url":"https://doi.org/10.1016/j.neubiorev.2016.08.008","accessedDate":"2026-10-07"},{"order":2,"authors":"Paruthi S, Brooks LJ, D’Ambrosio C, et al.","title":"Recommended amount of sleep for pediatric populations: A consensus recommendation of the American Academy of Sleep Medicine","journalOrPublisher":"Journal of Clinical Sleep Medicine","year":2016,"doi":"10.5664/jcsm.5866","url":"https://doi.org/10.5664/jcsm.5866","accessedDate":"2026-10-07"}]}},"what-does-homeostasis-mean-in-the-nervous-system":{"ok":true,"generatedAt":"2026-11-02T01:40:03+09:00","settings":{"siteTitle":"Young Bio-Scholar's Research Archive","authorNickname":"YOUNG BIO-SCHOLAR","authorLogoPath":"shared/author-logo.webp","imageBaseUrl":"/images/","archiveBasePath":"/archive/","postsPerListPage":5,"timezone":"Asia/Seoul"},"post":{"no":11,"title":"What Does Homeostasis Mean in the Nervous System?","slug":"what-does-homeostasis-mean-in-the-nervous-system","url":"/archive/what-does-homeostasis-mean-in-the-nervous-system","contentType":"Learning Note","inquiryStage":"","activityDate":"2024-07-06","activityYear":2024,"publishDate":"2024-07-06","cmsPublishedAt":"2026-10-08T15:53:28+09:00","researchTheme":"Biomedical Science","authorNickname":"YOUNG BIO-SCHOLAR","authorLogoUrl":"/images/shared/author-logo.webp","featuredImageUrl":"/images/archive/post-022/cover.webp","featuredImageAlt":"A chalk outline of a human head filled with an interconnected brain network","researchQuestion":"What changes in the brain when the systems that maintain nervous system homeostasis begin to fail in Alzheimer’s disease?","showOnHome":true,"showInProposals":false,"seo":{"title":"What Does Homeostasis Mean in the Nervous System? | Young Bio-Scholar’s Research Archive","description":"A Grade 10 learning note exploring homeostasis as active balance in the nervous system and why this idea matters for understanding Alzheimer’s disease.","ogImageUrl":"/images/archive/post-022/cover.webp"},"reflection":"I previously thought that homeostasis meant keeping the body in one fixed state. I now understand it as continuous adjustment. Learning this changed how I viewed the nervous system: stable brain function depends on many cells and processes responding to change together.","notes":"","revisionNote":"","blocks":[{"order":1,"type":"Paragraph","headingLevel":"","heading":"","content":"After developing my first research project about depression and sleeping time, I began exploring a different question about the brain.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":2,"type":"Heading","headingLevel":"H2","heading":"HOMEOSTASIS IS A DYNAMIC BALANCE","content":"","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":3,"type":"Paragraph","headingLevel":"","heading":"","content":"Homeostasis is the process of keeping internal conditions within a range that allows cells and systems to function.\n\nThis does not mean that the body remains completely unchanged. Conditions may move up or down, but regulatory systems respond before the change becomes too large.\n\nIn the nervous system, stability must be maintained while signals continue to travel between cells. The balance is active rather than still.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":4,"type":"Heading","headingLevel":"H2","heading":"WHAT NEEDS TO BE CONTROLLED?","content":"","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":5,"type":"Paragraph","headingLevel":"","heading":"","content":"Neurons depend on carefully controlled conditions. They need a steady supply of oxygen and glucose to produce energy. They also depend on the movement of ions across cell membranes to create electrical signals. Chemical messengers must be released, recognized, and removed at the correct times. Waste products must also be cleared so that they do not interfere with cellular activity.\n\nIf these conditions move too far outside their normal ranges, communication between neurons may become less reliable.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":6,"type":"Heading","headingLevel":"H2","heading":"MORE THAN NEURONS","content":"","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":7,"type":"Paragraph","headingLevel":"","heading":"","content":"I first imagined the nervous system mainly as a network of neurons. I began to understand that neurons do not maintain their environment alone.\n\nOther brain cells help support neural activity. Astrocytes assist with the chemical environment around neurons and help provide energy. Microglia respond to damage and changes in the brain’s immune environment. Blood vessels deliver oxygen and nutrients while helping remove waste.\n\nHomeostasis in the nervous system therefore depends on communication among several cell types, not only on the activity of neurons.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":8,"type":"Image","headingLevel":"","heading":"","content":"","quoteSource":"","imageUrl":"/images/archive/post-022/figure-01.webp","imageAlt":"A chalk drawing of connected neurons on a dark background","caption":""},{"order":9,"type":"Heading","headingLevel":"H2","heading":"WHEN BALANCE BECOMES HARDER TO MAINTAIN","content":"","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":10,"type":"Paragraph","headingLevel":"","heading":"","content":"A regulatory response can protect the brain when a change is temporary. However, a continuing disturbance may place stress on the same system.\n\nProblems involving energy use, protein handling, inflammation, waste removal, or neural activity may affect one another. A change in one part of the system can create more pressure on another part.\n\nThis helped me see why a nervous system disorder may be difficult to explain through only one molecule or pathway.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":11,"type":"Heading","headingLevel":"H2","heading":"CONNECTING HOMEOSTASIS TO ALZHEIMER’S RESEARCH","content":"","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":12,"type":"Paragraph","headingLevel":"","heading":"","content":"As I began studying Alzheimer’s disease, homeostasis became an important organizing idea.\n\nThe disease is often introduced through amyloid and tau, but brain function also depends on interactions among neurons, supporting cells, blood vessels, immune responses, and metabolic systems.\n\nThis did not mean that I had identified one cause or one solution. Instead, it suggested a new way to organize my learning: Alzheimer’s disease could be examined as a condition in which several systems that normally support brain stability become disturbed.\n\nThis idea later helped me consider why treatment strategies may need to address different parts of the disease process rather than focusing on only one target.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""}],"references":[{"order":1,"authors":"De Strooper B, Karran E","title":"The Cellular Phase of Alzheimer’s Disease","journalOrPublisher":"Cell, 164(4), 603–615","year":2016,"doi":"10.1016/j.cell.2015.12.056","url":"https://doi.org/10.1016/j.cell.2015.12.056","accessedDate":"2026-10-08"},{"order":2,"authors":"Frere S, Slutsky I","title":"Alzheimer’s Disease: From Firing Instability to Homeostasis Network Collapse","journalOrPublisher":"Neuron, 97(1), 32–58","year":2018,"doi":"10.1016/j.neuron.2017.11.028","url":"https://doi.org/10.1016/j.neuron.2017.11.028","accessedDate":"2026-10-08"}]}},"how-can-the-gut-communicate-with-the-brain":{"ok":true,"generatedAt":"2026-11-02T01:35:48+09:00","settings":{"siteTitle":"Young Bio-Scholar's Research Archive","authorNickname":"YOUNG BIO-SCHOLAR","authorLogoPath":"shared/author-logo.webp","imageBaseUrl":"/images/","archiveBasePath":"/archive/","postsPerListPage":5,"timezone":"Asia/Seoul"},"post":{"no":5,"title":"How Can the Gut Communicate with the Brain?","slug":"how-can-the-gut-communicate-with-the-brain","url":"/archive/how-can-the-gut-communicate-with-the-brain","contentType":"Learning Note","inquiryStage":"","activityDate":"2025-03-09","activityYear":2025,"publishDate":"2025-03-09","cmsPublishedAt":"2026-10-30T20:19:13+09:00","researchTheme":"Biomedical Science","authorNickname":"YOUNG BIO-SCHOLAR","authorLogoUrl":"/images/shared/author-logo.webp","featuredImageUrl":"/images/archive/post-028/cover.webp","featuredImageAlt":"Paper-craft food scene with a hand reaching for a snack beside fruit, soup, and a drink","researchQuestion":"","showOnHome":true,"showInProposals":false,"seo":{"title":"How Can the Gut Communicate with the Brain?","description":"Exploring how the gut and brain exchange signals and how this connection leads to questions about dietary patterns and anxiety symptoms.","ogImageUrl":"/images/archive/post-028/cover.webp"},"reflection":"This topic widened my view of the nervous system. I began to think about the brain as part of an interacting body system.\n\nIt also helped me distinguish two kinds of questions: how a connection might work biologically, and whether a relationship can be observed in human data.\n\nThe gut–brain axis provides a starting point for asking about diet and anxiety. Studying that relationship requires its own evidence.","notes":"","revisionNote":"","blocks":[{"order":1,"type":"Heading","headingLevel":"H2","heading":"SUMMARY","content":"","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":2,"type":"Paragraph","headingLevel":"","heading":"","content":"Exploring how the gut and brain exchange signals helped me connect my interest in the nervous system with a new question: could dietary patterns be related to anxiety symptoms?","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":3,"type":"Heading","headingLevel":"H2","heading":"STARTING QUESTION","content":"","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":4,"type":"Paragraph","headingLevel":"","heading":"","content":"My earlier learning about depression, sleep, and Alzheimer’s disease focused mainly on the brain and nervous system. I wanted to understand how changes in these systems could relate to health and behavior.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":5,"type":"Paragraph","headingLevel":"","heading":"","content":"This led me to consider a broader question:","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":6,"type":"Paragraph","headingLevel":"","heading":"","content":"Could understanding the brain also require looking beyond the brain?","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":7,"type":"Paragraph","headingLevel":"","heading":"","content":"The gut became an interesting starting point. Digestion and emotions can seem like separate subjects, yet nervousness can come with stomach discomfort. I wanted to understand the biological connections behind this relationship.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":8,"type":"Heading","headingLevel":"H2","heading":"A TWO-WAY CONNECTION","content":"","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":9,"type":"Paragraph","headingLevel":"","heading":"","content":"The gut–brain axis describes communication between the digestive system and the brain.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":10,"type":"Paragraph","headingLevel":"","heading":"","content":"Signals travel in both directions. The brain can influence digestive activity, while signals from the gut can reach systems involved in regulating the body. This communication involves interacting neural, hormonal, and immune pathways.[1]","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":11,"type":"Paragraph","headingLevel":"","heading":"","content":"The word axis initially sounded like a single connection. A more useful way to understand it is as a network of communication routes.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":12,"type":"Heading","headingLevel":"H2","heading":"MORE THAN ONE ROUTE","content":"","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":13,"type":"Heading","headingLevel":"H3","heading":"Neural signals","content":"","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":14,"type":"Paragraph","headingLevel":"","heading":"","content":"The gut has its own network of neurons, called the enteric nervous system. It also communicates with the central nervous system through pathways that include the vagus nerve.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":15,"type":"Heading","headingLevel":"H3","heading":"Hormonal signals","content":"","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":16,"type":"Paragraph","headingLevel":"","heading":"","content":"Chemical messengers help coordinate digestion, appetite, and responses to stress. They provide another route through which conditions in the body can influence gut–brain communication.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":17,"type":"Heading","headingLevel":"H3","heading":"Immune signals","content":"","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":18,"type":"Paragraph","headingLevel":"","heading":"","content":"Immune activity in the gut can also participate in this network. This means that communication is not limited to electrical signals carried by nerves.[1]","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":19,"type":"Paragraph","headingLevel":"","heading":"","content":"These routes helped me see why studying the gut and brain requires ideas from several areas of biology.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":20,"type":"Heading","headingLevel":"H2","heading":"WHERE DO GUT MICROBES FIT?","content":"","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":21,"type":"Image","headingLevel":"","heading":"","content":"","quoteSource":"","imageUrl":"/images/archive/post-028/gut-microbiota.webp","imageAlt":"Paper-craft illustration of gut microbes on a pink intestinal silhouette against a blue background","caption":""},{"order":22,"type":"Paragraph","headingLevel":"","heading":"","content":"The gut also contains communities of microorganisms, collectively called the gut microbiota.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":23,"type":"Paragraph","headingLevel":"","heading":"","content":"Microbes can produce substances during the breakdown of food. Researchers investigate how these substances and interactions with the body may influence gut–brain signaling.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":24,"type":"Paragraph","headingLevel":"","heading":"","content":"However, a possible pathway is different from a demonstrated effect on human mental health. Evidence from animal experiments can help researchers explore mechanisms, but it cannot automatically establish the same effect in people.[2]","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":25,"type":"Heading","headingLevel":"H2","heading":"FROM A BIOLOGICAL CONNECTION TO A RESEARCH QUESTION","content":"","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":26,"type":"Paragraph","headingLevel":"","heading":"","content":"Food enters this picture because diet can influence the environment in which gut microbes live. This gives a biological reason to investigate connections between eating patterns and mental health.[2]","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":27,"type":"Paragraph","headingLevel":"","heading":"","content":"It does not establish that a particular food causes or prevents anxiety.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":28,"type":"Paragraph","headingLevel":"","heading":"","content":"Instead, it helped me form a question that could be examined using human data:","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":29,"type":"Paragraph","headingLevel":"","heading":"","content":"Are differences in dietary patterns associated with differences in anxiety symptoms?","quoteSource":"","imageUrl":"","imageAlt":"","caption":""},{"order":30,"type":"Paragraph","headingLevel":"","heading":"","content":"Answering that question would require more than describing a biological pathway. It would require deciding how to measure diet and anxiety, and considering other factors that might be related to both.","quoteSource":"","imageUrl":"","imageAlt":"","caption":""}],"references":[{"order":1,"authors":"Carabotti M, Scirocco A, Maselli MA, Severi C","title":"The gut-brain axis: interactions between enteric microbiota, central and enteric nervous systems","journalOrPublisher":"Annals of Gastroenterology","year":2015,"doi":"","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC4367209/","accessedDate":"2026-10-30"},{"order":2,"authors":"Mayer EA, Tillisch K, Gupta A","title":"Gut/brain axis and the microbiota","journalOrPublisher":"The Journal of Clinical Investigation","year":2015,"doi":"10.1172/JCI76304","url":"https://www.jci.org/articles/view/76304","accessedDate":"2026-10-30"}]}}};</script>
<script>
(() => {
  'use strict';

  const API_VERSION = '20261102-speed-v1';
  const selectedThread = new URLSearchParams(location.search).get('thread') || '';
  const LIST_API_URL = `/api/archive?v=${API_VERSION}${selectedThread ? "&mode=threads" : ""}`;
  const DETAIL_API_URL = '/api/archive-detail';
  const CACHE_KEY = selectedThread ? 'young-bio-archive-threads-v1' : 'young-bio-archive-list-v16';
  const DETAIL_CACHE_PREFIX = 'young-bio-archive-detail-v16:';
  const CACHE_MAX_AGE_MS = 7 * 24 * 60 * 60 * 1000;
  const CONTENT_TYPES = ['Learning Note', 'Paper Review', 'Inquiry', 'Research Project', 'Introduction'];
  const CONTENT_TYPE_ALIASES = {
    'Concept Note': 'Learning Note',
    'Research Note': 'Learning Note',
    Analysis: 'Learning Note',
    Reflection: 'Learning Note',
    'Review Paper': 'Paper Review',
    Question: 'Inquiry',
    'Hypothesis Note': 'Inquiry',
    Proposal: 'Inquiry',
    'Original Research': 'Research Project'
  };
  const state = {
    posts: [],
    details: {},
    settings: { postsPerListPage: 5 },
    generatedAt: '',
    selectedYear: 'all',
    selectedType: 'all',
    selectedTheme: 'all',
    listPage: 1,
    currentSlug: ''
  };

  const $ = (selector) => document.querySelector(selector);
  const escapeHtml = (value) => String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');

  const joinClass = (...items) => items.filter(Boolean).join(' ');
  const cleanText = (value) => value == null ? '' : String(value).trim();
  const hasText = (value) => Boolean(cleanText(value));
  const normalizeContentType = (value) => CONTENT_TYPE_ALIASES[cleanText(value)] || cleanText(value);
  const normalizeInquiryStage = (value, originalType) => {
    if (normalizeContentType(originalType) !== 'Inquiry') return '';
    const stage = cleanText(value);
    if (['Question', 'Hypothesis', 'Proposal'].includes(stage)) return stage;
    return originalType === 'Question' ? 'Question'
      : originalType === 'Hypothesis Note' ? 'Hypothesis'
        : originalType === 'Proposal' ? 'Proposal' : '';
  };
  const normalizePost = (post = {}) => {
    const originalType = cleanText(post.contentType);
    return {
      ...post,
      authorNickname: 'Jiyun Lim',
      authorLogoUrl: '/images/shared/jiyun-lim-complete-logo.png',
      contentType: normalizeContentType(originalType),
      inquiryStage: normalizeInquiryStage(post.inquiryStage, originalType),
      researchQuestion: cleanText(post.researchQuestion),
      reflection: cleanText(post.reflection),
      notes: cleanText(post.notes),
      revisionNote: cleanText(post.revisionNote),
      blocks: Array.isArray(post.blocks) ? post.blocks : [],
      references: Array.isArray(post.references) ? post.references : []
    };
  };
  const formatDate = (value) => {
    if (!value) return '';
    const date = new Date(`${value}T00:00:00`);
    return Number.isNaN(date.getTime())
      ? escapeHtml(value)
      : new Intl.DateTimeFormat('en-US', { year: 'numeric', month: 'short', day: '2-digit' })
        .format(date).toUpperCase();
  };

  function showLoading() {
    $('#post-title').textContent = 'Loading the research archive…';
    $('#meta-kicker').innerHTML = '';
    $('#post-details').innerHTML = '';
    $('#post-body').innerHTML = '<p class="cms-status">Connecting to the archive.</p>';
    $('#post-pagination').innerHTML = '';
  }

  function showError(message) {
    $('#post-title').textContent = 'The archive could not be loaded.';
    $('#post-body').innerHTML = `
      <div class="cms-error" role="alert">
        <p>${escapeHtml(message)}</p>
        <button class="page-btn" id="cms-retry" type="button">RETRY</button>
      </div>`;
    $('#cms-retry')?.addEventListener('click', loadCms);
  }

  function showEmpty() {
    $('#meta-kicker').innerHTML = '<span>ARCHIVE PREPARING</span>';
    $('#post-title').textContent = 'The first research entry is being prepared.';
    $('#post-details').innerHTML = '';
    $('#post-body').innerHTML = '<p class="cms-status">Published entries will appear here automatically.</p>';
    $('#post-index-body').innerHTML = '';
    $('#empty-list').hidden = false;
    $('#empty-list').textContent = 'No published posts are available yet.';
    $('#list-pagination').innerHTML = '';
    $('#post-pagination').innerHTML = '';
  }

  function availableValues(key) {
    return [...new Set(state.posts.map((post) => post[key]).filter(Boolean))]
      .sort((a, b) => String(a).localeCompare(String(b)));
  }

  function fillSelect(selector, values, firstLabel) {
    const select = $(selector);
    select.innerHTML = `<option value="all">${escapeHtml(firstLabel)}</option>`;
    values.forEach((value) => {
      const option = document.createElement('option');
      option.value = value;
      option.textContent = value;
      select.appendChild(option);
    });
  }

  function fillYearButtons() {
    const container = $('.year-options');
    const years = availableValues('activityYear').sort((a, b) => b - a);
    container.innerHTML = [
      '<button class="year-btn active" type="button" data-year="all">ALL</button>',
      ...years.map((year) => `<button class="year-btn" type="button" data-year="${escapeHtml(year)}">${escapeHtml(year)}</button>`)
    ].join('');
    container.querySelectorAll('[data-year]').forEach((button) => {
      button.addEventListener('click', () => {
        container.querySelectorAll('[data-year]').forEach((item) => item.classList.remove('active'));
        button.classList.add('active');
        state.selectedYear = button.dataset.year;
        state.listPage = 1;
        renderList();
      });
    });
  }

  function filteredPosts() {
    return state.posts.filter((post) =>
      (!selectedThread || cleanText(post.researchThread).replaceAll("’", "'" ) === selectedThread.replaceAll("’", "'" )) &&
      (state.selectedYear === 'all' || String(post.activityYear) === state.selectedYear) &&
      (state.selectedType === 'all' || post.contentType === state.selectedType) &&
      (state.selectedTheme === 'all' || post.researchTheme === state.selectedTheme)
    );
  }

  function renderList() {
    const filtered = filteredPosts();
    const perPage = Number(state.settings.postsPerListPage) || 5;
    const pageCount = Math.max(1, Math.ceil(filtered.length / perPage));
    state.listPage = Math.min(state.listPage, pageCount);
    const visible = filtered.slice((state.listPage - 1) * perPage, state.listPage * perPage);

    $('#post-index-body').innerHTML = visible.map((post) => `
      <tr>
        <td>${escapeHtml(post.no)}</td>
        <td><button class="post-title-link" type="button" data-slug="${escapeHtml(post.slug)}">${escapeHtml(post.title)}</button></td>
        <td>${escapeHtml(post.activityYear)}</td>
        <td>${escapeHtml(post.contentType)}</td>
        <td>${formatDate(post.publishDate)}</td>
      </tr>`).join('');

    $('#empty-list').hidden = visible.length > 0;
    $('#empty-list').textContent = 'No posts match the selected filters.';
    $('#list-pagination').innerHTML = pageCount > 1
      ? Array.from({ length: pageCount }, (_, index) => {
        const page = index + 1;
        return `<button class="page-btn ${page === state.listPage ? 'active' : ''}" type="button" data-list-page="${page}">${page}</button>`;
      }).join('')
      : '';

    document.querySelectorAll('[data-slug]').forEach((button) => {
      button.addEventListener('click', () => {
        renderPost(button.dataset.slug, true);
        closeList();
      });
    });
    document.querySelectorAll('[data-list-page]').forEach((button) => {
      button.addEventListener('click', () => {
        state.listPage = Number(button.dataset.listPage);
        renderList();
      });
    });
  }

  function renderBlocks(blocks) {
    return (blocks || []).map((block) => {
      if (!block || !hasText(block.type)) return '';
      const content = cleanText(block.content);
      const heading = cleanText(block.heading);
      const quoteSource = cleanText(block.quoteSource);
      const imageUrl = cleanText(block.imageUrl);
      const imageAlt = cleanText(block.imageAlt);
      const caption = cleanText(block.caption);
      const headingTag = ['H2', 'H3', 'H4'].includes(block.headingLevel) ? block.headingLevel.toLowerCase() : 'h2';
      switch (block.type) {
        case 'Heading':
          return heading ? `<${headingTag}>${escapeHtml(heading)}</${headingTag}>` : '';
        case 'Paragraph':
          return content ? `<p>${escapeHtml(content).replaceAll('\n', '<br>')}</p>` : '';
        case 'Quote':
          return content ? `
            <figure class="article-quote">
              <blockquote>${escapeHtml(content)}</blockquote>
              ${quoteSource ? `<cite>— ${escapeHtml(quoteSource)}</cite>` : ''}
            </figure>` : '';
        case 'Image':
          return imageUrl ? `
            <figure class="article-image">
              <img src="${escapeHtml(imageUrl)}" alt="${escapeHtml(imageAlt)}" loading="lazy">
              ${caption ? `<figcaption>${escapeHtml(caption)}</figcaption>` : ''}
            </figure>` : '';
        case 'List': {
          const items = content.split(/\r?\n/).map((item) => item.replace(/^[-*]\s*/, '').trim()).filter(Boolean);
          return items.length ? `<ul>${items.map((item) => `<li>${escapeHtml(item)}</li>`).join('')}</ul>` : '';
        }
        case 'Table':
          return renderTextTable(content);
        case 'Embed':
          return /^https?:\/\//i.test(content)
            ? `<p><a href="${escapeHtml(content)}" target="_blank" rel="noopener noreferrer">View related material ↗</a></p>`
            : '';
        default:
          return '';
      }
    }).join('');
  }

  function renderTextTable(content) {
    const rows = String(content || '').split(/\r?\n/).map((row) =>
      row.split(/\t|\|/).map((cell) => cell.trim()).filter((cell, index, array) => cell || (index > 0 && index < array.length - 1))
    ).filter((row) => row.length);
    if (!rows.length) return '';
    return `<div class="article-table-wrap"><table class="article-table">${rows.map((row, rowIndex) =>
      `<tr>${row.map((cell) => rowIndex === 0 ? `<th>${escapeHtml(cell)}</th>` : `<td>${escapeHtml(cell)}</td>`).join('')}</tr>`
    ).join('')}</table></div>`;
  }

  function paintPost(post, pushState = false) {
    if (!post) return showEmpty();
    state.currentSlug = post.slug;

    post = normalizePost(post);
    $('#meta-kicker').innerHTML = `
      <span>${escapeHtml(post.contentType)}</span>
      ${post.contentType === 'Inquiry' && hasText(post.inquiryStage) ? `<span>${escapeHtml(post.inquiryStage)}</span>` : ''}
      <span>${escapeHtml(post.activityYear)}</span>
      <span>${escapeHtml(post.researchTheme)}</span>`;
    $('#post-title').textContent = post.title;
    $('#post-details').innerHTML = `
      <span class="author-profile">
        <span class="author-logo" aria-hidden="true">
          ${post.authorLogoUrl
            ? `<img src="${escapeHtml(post.authorLogoUrl)}" alt="">`
            : '<svg viewBox="0 0 40 52"><path d="M9 4c15 8 7 17 22 25M31 4C16 12 24 21 9 29M11 9h16M10 16h18M12 23h15M12 30h16M10 37h18M12 44h15" stroke="currentColor" fill="none" stroke-width="1.7" stroke-linecap="round"/></svg>'}
        </span>
        <span class="author-name">${escapeHtml(post.authorNickname)}</span>
      </span>
      <span class="published-date">PUBLISHED <strong>${formatDate(post.publishDate)}</strong></span>`;

    const featured = hasText(post.featuredImageUrl)
      ? `<figure class="featured-image"><img src="${escapeHtml(post.featuredImageUrl)}" alt="${escapeHtml(post.featuredImageAlt)}"></figure>`
      : '';
    const question = hasText(post.researchQuestion)
      ? `<div class="research-question"><span class="label">MY CONTINUING QUESTION</span><p>${escapeHtml(post.researchQuestion)}</p></div>`
      : '';
    const reflection = hasText(post.reflection)
      ? `<div class="reflection"><h2>Reflection</h2><p>${escapeHtml(post.reflection).replaceAll('\n', '<br>')}</p></div>`
      : '';
    const notes = hasText(post.notes)
      ? `<section class="post-notes"><h2>NOTES</h2><p>${escapeHtml(post.notes).replaceAll('\n', '<br>')}</p></section>`
      : '';
    const revision = hasText(post.revisionNote)
      ? `<section class="revision-note"><h2>REVISION NOTE</h2><p>${escapeHtml(post.revisionNote).replaceAll('\n', '<br>')}</p></section>`
      : '';
    const validReferences = post.references.filter((reference) => reference && [
      reference.authors, reference.title, reference.journalOrPublisher,
      reference.year, reference.doi, reference.url
    ].some(hasText));
    const references = validReferences.length
      ? `<section class="references"><h2>REFERENCES</h2><ol>${validReferences.map((reference) => {
        const title = hasText(reference.url)
          ? `<a href="${escapeHtml(reference.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(reference.title)}</a>`
          : escapeHtml(reference.title);
        const details = [reference.authors, title, reference.journalOrPublisher, reference.year, reference.doi ? `DOI: ${escapeHtml(reference.doi)}` : ''].filter(Boolean).join('. ');
        return `<li>${details}</li>`;
      }).join('')}</ol></section>`
      : '';

    $('#post-body').innerHTML = featured + renderBlocks(post.blocks) + question + reflection + notes + revision + references;
    renderPostPagination();
    document.title = `${post.seo?.title || post.title} | Young Bio-Scholar's Research Archive`;
    document.querySelector('meta[name="description"]')?.setAttribute('content', post.seo?.description || 'Student biology research archive.');

    if (pushState) history.pushState({ slug: post.slug }, '', `/archive/${encodeURIComponent(post.slug)}${selectedThread ? '?thread=' + encodeURIComponent(selectedThread) : ''}`);
    window.scrollTo({ top: $('.archive-title-row').offsetTop, behavior: 'smooth' });
  }

  function detailCacheKey(slug) {
    return `${DETAIL_CACHE_PREFIX}${slug}`;
  }

  function readDetailCache(slug) {
    try {
      const cached = JSON.parse(localStorage.getItem(detailCacheKey(slug)) || 'null');
      if (!cached?.savedAt || !cached?.payload?.ok || !cached?.payload?.post) return window.BIO_ARCHIVE_DETAILS?.[slug] || null;
      if (Date.now() - cached.savedAt > CACHE_MAX_AGE_MS) {
        localStorage.removeItem(detailCacheKey(slug));
        return null;
      }
      return cached.payload;
    } catch (error) {
      return null;
    }
  }

  function writeDetailCache(slug, payload) {
    try {
      localStorage.setItem(detailCacheKey(slug), JSON.stringify({ savedAt: Date.now(), payload }));
    } catch (error) {
      console.warn('Post cache could not be saved.', error);
    }
  }

  async function renderPost(slug, pushState = false) {
    // A cached list may predate a newly published entry. Keep the requested
    // slug and fetch its detail directly instead of opening an unrelated post.
    const requested = String(slug || '').trim();
    const summary = requested
      ? state.posts.find((item) => item.slug === requested) || { slug: requested, title: 'Loading this research entry…' }
      : state.posts[0];
    if (!summary) return showEmpty();

    const cachedPayload = readDetailCache(summary.slug);
    if (cachedPayload) {
      state.details[summary.slug] = cachedPayload.post;
      paintPost(cachedPayload.post, pushState);
    } else {
      paintPost(summary, pushState);
      $('#post-body').innerHTML = '<p class="cms-status">Loading this research entry…</p>';
    }

    try {
      const response = await fetch(`${DETAIL_API_URL}?slug=${encodeURIComponent(summary.slug)}&v=${API_VERSION}`, {
        method: 'GET',
        cache: 'no-store'
      });
      if (!response.ok) throw new Error(`Post request failed (${response.status}).`);
      const payload = await response.json();
      if (!payload.ok || !payload.post) throw new Error(payload.error || 'Invalid post response.');

      writeDetailCache(summary.slug, payload);
      payload.post = normalizePost(payload.post);
      state.details[summary.slug] = payload.post;
      if (!cachedPayload || payload.generatedAt !== cachedPayload.generatedAt) paintPost(payload.post, false);
    } catch (error) {
      console.error(error);
      if (!cachedPayload) {
        $('#post-body').innerHTML = `
          <div class="cms-error" role="alert">
            <p>This research entry could not be loaded.</p>
            <button class="page-btn" id="post-retry" type="button">RETRY</button>
          </div>`;
        $('#post-retry')?.addEventListener('click', () => renderPost(summary.slug, false));
      }
    }
  }

  function renderPostPagination() {
    const currentIndex = state.posts.findIndex((post) => post.slug === state.currentSlug);
    const current = currentIndex + 1;
    const total = state.posts.length;
    const numbers = [1, current - 2, current - 1, current, current + 1, current + 2, total]
      .filter((number) => number >= 1 && number <= total)
      .filter((number, index, array) => array.indexOf(number) === index)
      .sort((a, b) => a - b);
    let html = `<button class="page-btn" type="button" data-nav-index="${currentIndex - 1}" ${currentIndex <= 0 ? 'disabled' : ''}>←</button>`;
    numbers.forEach((number, index) => {
      if (index && number - numbers[index - 1] > 1) html += '<span class="page-ellipsis">…</span>';
      const post = state.posts[number - 1];
      html += `<button class="${joinClass('page-btn', number === current && 'active')}" type="button" data-nav-slug="${escapeHtml(post.slug)}" ${number === current ? 'aria-current="page"' : ''}>${number}</button>`;
    });
    html += `<button class="page-btn" type="button" data-nav-index="${currentIndex + 1}" ${currentIndex >= total - 1 ? 'disabled' : ''}>→</button>`;
    $('#post-pagination').innerHTML = html;
    document.querySelectorAll('[data-nav-slug]').forEach((button) => button.addEventListener('click', () => renderPost(button.dataset.navSlug, true)));
    document.querySelectorAll('[data-nav-index]').forEach((button) => button.addEventListener('click', () => {
      const post = state.posts[Number(button.dataset.navIndex)];
      if (post) renderPost(post.slug, true);
    }));
  }

  function closeList() {
    $('#post-list-panel').hidden = true;
    $('.post-list-toggle').setAttribute('aria-expanded', 'false');
  }

  function requestedSlug() {
    const match = location.pathname.match(/\/archive\/([^/]+)\/?$/);
    if (match) return decodeURIComponent(match[1]);
    return new URLSearchParams(location.search).get('slug') || '';
  }

  function readCmsCache() {
    try {
      const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if (!cached?.savedAt || !cached?.payload?.ok) return null;
      if (Date.now() - cached.savedAt > CACHE_MAX_AGE_MS) {
        localStorage.removeItem(CACHE_KEY);
        return null;
      }
      return cached.payload;
    } catch (error) {
      return null;
    }
  }

  function writeCmsCache(payload) {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({ savedAt: Date.now(), payload }));
    } catch (error) {
      console.warn('CMS cache could not be saved.', error);
    }
  }

  function applyPayload(payload) {
    state.posts = Array.isArray(payload.posts) ? payload.posts.map(normalizePost) : [];
    state.posts.sort((a,b) => (Date.parse(b.publishDate) || 0) - (Date.parse(a.publishDate) || 0));
    if (selectedThread) state.posts.sort((a,b) => (Date.parse(a.publishDate) || 0) - (Date.parse(b.publishDate) || 0)
      || cleanText(a.slug).localeCompare(cleanText(b.slug)));
    state.settings = payload.settings || state.settings;
    state.generatedAt = payload.generatedAt || '';
    if (!state.posts.length) {
      showEmpty();
      return;
    }

    fillYearButtons();
    fillSelect('#type-filter', CONTENT_TYPES, 'All Types');
    fillSelect('#theme-filter', availableValues('researchTheme'), 'All Themes');
    if (selectedThread) {
      $('#thread-selection').hidden = false;
      $('#thread-selection-name').textContent = selectedThread.replace(' and ', ' & ');
      $('#post-list-panel').hidden = false;
      $('.post-list-toggle').setAttribute('aria-expanded','true');
    }
    renderList();
    const first = filteredPosts()[0];
    if (requestedSlug() || first) renderPost(requestedSlug() || first.slug, false);
    else {
      $('#post-title').textContent = 'This research thread is coming soon.';
      $('#post-body').textContent = 'Published entries for this research thread will appear here automatically.';
      $('#post-details').replaceChildren(); $('#meta-kicker').replaceChildren(); $('#post-pagination').replaceChildren();
    }
  }

  async function loadCms() {
    const cachedPayload = readCmsCache() || window.BIO_ARCHIVE_BOOTSTRAP;
    if (cachedPayload) applyPayload(cachedPayload);
    else showLoading();

    try {
      const response = await fetch(LIST_API_URL, { method: 'GET', cache: 'no-store' });
      if (!response.ok) throw new Error(`API request failed (${response.status}).`);
      const payload = await response.json();
      if (!payload.ok) throw new Error(payload.message || payload.error || 'The CMS returned an error.');
      writeCmsCache(payload);
      if (!cachedPayload || payload.generatedAt !== state.generatedAt) applyPayload(payload);
    } catch (error) {
      console.error(error);
      if (!cachedPayload) showError('Please check the CMS web-app deployment and try again.');
    }
  }

  $('.post-list-toggle').addEventListener('click', () => {
    const expanded = $('.post-list-toggle').getAttribute('aria-expanded') === 'true';
    $('.post-list-toggle').setAttribute('aria-expanded', String(!expanded));
    $('#post-list-panel').hidden = expanded;
  });
  $('.menu-toggle').addEventListener('click', () => {
    const expanded = $('.menu-toggle').getAttribute('aria-expanded') === 'true';
    $('.menu-toggle').setAttribute('aria-expanded', String(!expanded));
    $('.primary-nav').classList.toggle('open', !expanded);
  });
  $('#type-filter').addEventListener('change', (event) => {
    state.selectedType = event.target.value;
    state.listPage = 1;
    renderList();
  });
  $('#theme-filter').addEventListener('change', (event) => {
    state.selectedTheme = event.target.value;
    state.listPage = 1;
    renderList();
  });
  window.addEventListener('popstate', () => renderPost(requestedSlug() || state.posts[0]?.slug, false));

  loadCms();
})();

</script>
</body>
</html>
